<title>Próximos a Vencer – Olímpica Bogotá</title>
<style>
  :root {
    --verde: #E65100;
    --verde-oscuro: #BF360C;
    --verde-claro: #FBE9E7;
    --naranja: #FF6B00;
    --rojo: #D32F2F;
    --rojo-suave: #FFEBEE;
    --naranja-suave: #FFF3E0;
    --gris: #F5F5F5;
    --gris2: #E0E0E0;
    --texto: #1A1A1A;
    --texto-suave: #666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--gris);
    color: var(--texto);
    min-height: 100vh;
    padding-bottom: 30px;
  }
  .header {
    background: linear-gradient(135deg, var(--verde-oscuro) 0%, var(--verde) 100%);
    color: white;
    padding: 20px 16px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 12px rgba(0,100,50,0.3);
  }
  .header-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo-icon { width:36px;height:36px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .header h1 { font-size:18px;font-weight:700;letter-spacing:-0.3px; }
  .header-sub { font-size:12px;opacity:0.8;margin-left:46px; }
  .screen { display:none; }
  .screen.active { display:block; }
  .step-bar { background:white;padding:12px 16px;display:flex;align-items:center;border-bottom:1px solid var(--gris2); }
  .step-item { display:flex;align-items:center;gap:6px;flex:1; }
  .step-circle { width:24px;height:24px;border-radius:50%;background:var(--gris2);color:var(--texto-suave);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.3s; }
  .step-circle.active { background:var(--verde);color:white; }
  .step-circle.done { background:var(--verde-oscuro);color:white; }
  .step-label { font-size:10px;color:var(--texto-suave);font-weight:500;white-space:nowrap; }
  .step-label.active { color:var(--verde);font-weight:700; }
  .step-divider { flex:0.5;height:2px;background:var(--gris2);margin:0 4px; }
  .step-divider.done { background:var(--verde); }
  .section { padding:16px; }
  .section-title { font-size:13px;font-weight:700;color:var(--texto-suave);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px; }
  .store-card { background:white;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;transition:all 0.2s;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06); }
  .store-card:active { transform:scale(0.98);background:var(--verde-claro); }
  .store-card.selected { border-color:var(--verde);background:var(--verde-claro); }
  .store-icon { width:42px;height:42px;background:var(--verde-claro);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px; }
  .store-info { flex:1;min-width:0; }
  .store-id { font-size:18px;font-weight:800;color:var(--verde-oscuro);line-height:1; }
  .store-dir { font-size:12px;color:var(--texto-suave);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
  .store-check { width:22px;height:22px;border-radius:50%;background:var(--verde);color:white;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s; }
  .store-card.selected .store-check { opacity:1; }
  .entry-card { background:white;border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .entry-card-header { padding:14px 16px 12px;border-bottom:1px solid var(--gris2);display:flex;justify-content:space-between;align-items:flex-start; }
  .entry-num { width:28px;height:28px;border-radius:8px;background:var(--verde);color:white;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .delete-btn { background:none;border:none;color:var(--rojo);cursor:pointer;padding:4px;border-radius:6px;font-size:18px;line-height:1; }
  .entry-body { padding:14px 16px; }
  .field-group { margin-bottom:14px; }
  .field-group:last-child { margin-bottom:0; }
  .field-label { font-size:11px;font-weight:700;color:var(--texto-suave);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:6px;display:flex;align-items:center;gap:5px; }
  .field-label .required { color:var(--rojo); }
  input[type="text"], input[type="number"], input[type="date"], select {
    width:100%;padding:12px 14px;border:2px solid var(--gris2);border-radius:10px;font-size:16px;color:var(--texto);background:white;outline:none;transition:border-color 0.2s;-webkit-appearance:none;appearance:none;
  }
  input:focus, select:focus { border-color:var(--verde); }
  .ean-wrapper { position:relative; }
  .product-badge { background:var(--verde-claro);border-radius:8px;padding:8px 12px;margin-top:8px;display:none; }
  .product-badge.show { display:block; }
  .product-badge.error-badge { background:var(--rojo-suave); }
  .badge-name { font-size:13px;font-weight:700;color:var(--verde-oscuro); }
  .badge-name.err { color:var(--rojo); }
  .badge-ctg { font-size:11px;color:var(--texto-suave);margin-top:2px; }
  .alerta-pill { display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700; }
  .alerta-Rojo { background:var(--rojo);color:white; }
  .alerta-Naranja { background:var(--naranja);color:white; }
  .alerta-Verde { background:var(--verde);color:white; }
  .bottom-actions { position:sticky;bottom:0;background:white;border-top:1px solid var(--gris2);padding:12px 16px;display:flex;gap:10px;z-index:50; }
  .btn-primary { flex:1;background:var(--verde);color:white;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:8px; }
  .btn-primary:active { transform:scale(0.98);background:var(--verde-oscuro); }
  .btn-secondary { background:var(--gris);color:var(--texto);border:none;border-radius:12px;padding:15px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s; }
  .btn-secondary:active { background:var(--gris2); }
  .add-btn { width:100%;background:white;border:2px dashed var(--verde);color:var(--verde);border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;transition:all 0.2s; }
  .add-btn:active { background:var(--verde-claro); }
  .result-summary { background:linear-gradient(135deg, var(--verde-oscuro), var(--verde));border-radius:16px;padding:20px;color:white;margin-bottom:16px;text-align:center; }
  .result-summary h2 { font-size:22px;margin-bottom:4px; }
  .result-summary p { font-size:13px;opacity:0.85; }
  .result-stats { display:flex;gap:10px;margin-top:14px; }
  .stat-box { flex:1;background:rgba(255,255,255,0.15);border-radius:10px;padding:10px 8px;text-align:center; }
  .stat-num { font-size:22px;font-weight:800; }
  .stat-label { font-size:10px;opacity:0.85;margin-top:2px; }
  .result-item { background:white;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.07);border-left:4px solid var(--gris2); }
  .result-item.alerta-rojo { border-left-color:var(--rojo); }
  .result-item.alerta-naranja { border-left-color:var(--naranja); }
  .result-item.alerta-verde { border-left-color:var(--verde); }
  .result-ean { font-size:11px;color:var(--texto-suave);font-family:monospace; }
  .result-nombre { font-size:15px;font-weight:700;margin:3px 0 8px; }
  .result-grid { display:grid;grid-template-columns:1fr 1fr;gap:8px; }
  .result-field { background:var(--gris);border-radius:8px;padding:8px 10px; }
  .result-field-label { font-size:10px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:0.3px; }
  .result-field-val { font-size:15px;font-weight:700;color:var(--verde-oscuro);margin-top:2px; }
  .result-field-val.rojo { color:var(--rojo); }
  .result-field-val.naranja { color:var(--naranja); }
  .export-btn { width:100%;background:var(--verde-oscuro);color:white;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px; }
  .search-wrap { position:relative;margin-bottom:12px; }
  .search-wrap input { padding-left:40px !important; }
  .search-icon { position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--texto-suave);font-size:16px;pointer-events:none; }
  .toast { position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--texto);color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;white-space:nowrap; }

  .scan-btn {

  .ean-input { padding-right:52px !important; }
  #scannerModal {

    z-index:9999;flex-direction:column;align-items:center;justify-content:center;
  }
  #scannerModal.open { display:flex; }
  #scannerModal h3 { color:white;font-size:17px;margin-bottom:16px;font-weight:700; }
  #scannerVideo {
    width:min(360px, 92vw);height:min(260px, 60vw);
    object-fit:cover;border-radius:14px;border:3px solid var(--verde);
  }
  .scan-overlay {
    position:relative;width:min(360px, 92vw);height:min(260px, 60vw);
  }
  .scan-line {
    position:absolute;left:10%;right:10%;top:50%;height:2px;
    background:var(--verde);animation:scanAnim 1.5s ease-in-out infinite;

  @keyframes scanAnim { 0%,100%{top:20%} 50%{top:80%} }
  .scan-corners::before, .scan-corners::after {

  .scan-corners::before { top:8px;left:8px;border-width:3px 0 0 3px;border-radius:4px 0 0 0; }
  .scan-corners::after { bottom:8px;right:8px;border-width:0 3px 3px 0;border-radius:0 0 4px 0; }
  .scan-corners2::before, .scan-corners2::after {
    content:'';position:absolute;width:28px;height:28px;border-color:var(--verde);border-style:solid;

  .scan-corners2::before { top:8px;right:8px;border-width:3px 3px 0 0;border-radius:0 4px 0 0; }
  .scan-corners2::after { bottom:8px;left:8px;border-width:0 0 3px 3px;border-radius:0 0 0 4px; }
  #scanClose {

    border-radius:12px;padding:13px 32px;font-size:16px;font-weight:700;cursor:pointer;
  }
  #scanStatus { color:#aaa;font-size:13px;margin-top:10px;text-align:center; }

let selectedStore = null;
let entries = [];
let entryCount = 0;

renderStores(STORES);

function renderStores(list) {
  const el = document.getElementById('storeList');
  el.innerHTML = '';
  list.forEach(s => {
    const div = document.createElement('div');
    div.className = 'store-card' + (selectedStore && selectedStore.id === s.id ? ' selected' : '');
    div.onclick = () => selectStore(s, div);
    div.innerHTML =
      '<div class="store-icon">🏪</div>' +
      '<div class="store-info">' +
        '<div class="store-id">' + s.id + '</div>' +
        '<div class="store-dir">' + s.direccion + '</div>' +
      '</div>' +
      '<div class="store-check">✓</div>';
    el.appendChild(div);
  });
}

function filterStores() {
  const q = document.getElementById('storeSearch').value.toLowerCase();
  const filtered = STORES.filter(s =>
    String(s.id).includes(q) ||
    s.direccion.toLowerCase().includes(q) ||
    s.ciudad.toLowerCase().includes(q)
  );
  renderStores(filtered);
}

function selectStore(s, el) {
  selectedStore = s;
  document.querySelectorAll('.store-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  setTimeout(() => goScreen(2), 280);
}

function goScreen(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + n).classList.add('active');
  updateSteps(n);
  window.scrollTo(0,0);
  if (n === 2 && entries.length === 0) addEntry();
}

function updateSteps(n) {
  for (let i = 1; i <= 3; i++) {
    const circle = document.getElementById('sc' + i);
    const label = document.getElementById('sl' + i);
    circle.className = 'step-circle' + (i < n ? ' done' : i === n ? ' active' : '');
    label.className = 'step-label' + (i === n ? ' active' : '');
  }
  for (let i = 1; i <= 2; i++) {
    document.getElementById('sd' + i).className = 'step-divider' + (i < n ? ' done' : '');
  }
}

function lookupProduct(ean, storeId) {
  const list = PRODUCTS_BY_STORE[String(storeId)] || [];
  return list.find(p => p.ean === String(ean)) || null;
}

function addEntry() {
  entryCount++;
  const id = entryCount;
  entries.push({ id, ean: '', unidades: '', fecha: '', product: null });
  renderEntries();
  setTimeout(() => {
    const inp = document.getElementById('ean_' + id);
    if (inp) inp.focus();
  }, 120);
}

function removeEntry(id) {
  entries = entries.filter(e => e.id !== id);
  renderEntries();
}

function renderEntries() {
  const container = document.getElementById('entriesContainer');
  container.innerHTML = '';
  entries.forEach((entry, idx) => {
    const div = document.createElement('div');
    div.className = 'entry-card';
    const delBtn = entries.length > 1 ? '<button class="delete-btn" onclick="removeEntry(' + entry.id + ')">✕</button>' : '';
    const badgeHtml = entry.product
      ? '<div class="product-badge show"><div class="badge-name">✅ ' + entry.product.nombre + '</div><div class="badge-ctg">' + entry.product.ctg + ' · Días máx: ' + entry.product.dias_max + '</div></div>'
      : '<div class="product-badge" id="badge_' + entry.id + '"></div>';
    div.innerHTML =
      '<div class="entry-card-header">' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<div class="entry-num">' + (idx+1) + '</div>' +
          '<div><div style="font-size:13px;font-weight:700;">Producto #' + (idx+1) + '</div>' +
          '<div style="font-size:11px;color:var(--texto-suave)">PV ' + (selectedStore ? selectedStore.id : '') + '</div></div>' +
        '</div>' + delBtn +
      '</div>' +
      '<div class="entry-body">' +
        '<div class="field-group">' +
          '<div class="field-label">📦 EAN <span class="required">*</span></div>' +
          '<div class="ean-wrapper">' +
            '<input type="number" inputmode="numeric" class="ean-input" id="ean_' + entry.id + '" placeholder="Ej: 7709636632250" value="' + entry.ean + '" oninput="onEanChange(' + entry.id + ', this.value)">' +
            '<button class="scan-btn" onclick="openScanner(' + entry.id + ')" title="Escanear">📷</button>' +
          '</div>' +
          '<div id="badge_' + entry.id + '" class="product-badge' + (entry.product ? ' show' : '') + '">' +
            (entry.product ? '<div class="badge-name">✅ ' + entry.product.nombre + '</div><div class="badge-ctg">' + entry.product.ctg + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="field-group">' +
          '<div class="field-label">🔢 Unidades <span class="required">*</span></div>' +
          '<input type="number" inputmode="numeric" id="und_' + entry.id + '" placeholder="0" min="0" value="' + entry.unidades + '" oninput="onUndChange(' + entry.id + ', this.value)">' +
        '</div>' +
        '<div class="field-group">' +
          '<div class="field-label">📅 Fecha vencimiento <span class="required">*</span></div>' +
          '<input type="date" id="fecha_' + entry.id + '" value="' + entry.fecha + '" onchange="onFechaChange(' + entry.id + ', this.value)">' +
        '</div>' +

    container.appendChild(div);
  });
}

function onEanChange(id, val) {
  const entry = entries.find(e => e.id === id);
  if (!entry) return;
  entry.ean = val.trim();
  const product = lookupProduct(val.trim(), selectedStore ? selectedStore.id : null);
  entry.product = product;
  const badge = document.getElementById('badge_' + id);
  if (!badge) return;
  if (product) {
    badge.className = 'product-badge show';
    badge.innerHTML = '<div class="badge-name">✅ ' + product.nombre + '</div><div class="badge-ctg">' + product.ctg + ' · Días máx: ' + product.dias_max + '</div>';
  } else if (val.length > 5) {
    badge.className = 'product-badge show error-badge';
    badge.innerHTML = '<div class="badge-name err">⚠️ EAN no encontrado para este punto</div>';
  } else {
    badge.className = 'product-badge';
    badge.innerHTML = '';
  }
}

function onUndChange(id, val) {
  const entry = entries.find(e => e.id === id);
  if (entry) entry.unidades = val;
}

function onFechaChange(id, val) {
  const entry = entries.find(e => e.id === id);
  if (entry) entry.fecha = val;
}

function calculateResults() {
  entries.forEach(entry => {
    const e = document.getElementById('ean_' + entry.id);
    const u = document.getElementById('und_' + entry.id);
    const f = document.getElementById('fecha_' + entry.id);
    if (e) entry.ean = e.value.trim();
    if (u) entry.unidades = u.value;
    if (f) entry.fecha = f.value;
  });

  const valid = entries.filter(e => e.ean && e.unidades && e.fecha);
  if (valid.length === 0) { showToast('⚠️ Completa al menos un producto'); return; }

  const today = new Date(); today.setHours(0,0,0,0);
  const results = valid.map((entry, idx) => {
    const product = entry.product || lookupProduct(entry.ean, selectedStore ? selectedStore.id : null);
    const unidades = parseFloat(entry.unidades) || 0;
    const fechaVenc = new Date(entry.fecha); fechaVenc.setHours(0,0,0,0);
    const diasNetos = Math.max(0, Math.round((fechaVenc - today) / 86400000));
    let diasReales = diasNetos, vtaTotalEst = '', alerta = 'Sin datos', unidRiesgo = '';
    if (product) {
      diasReales = diasNetos - (product.dias_max || 0);
      vtaTotalEst = diasReales > 0 ? Math.floor(product.prom_dia * diasReales) : 0;
      if (unidades > 0) {
        if (unidades > vtaTotalEst) alerta = 'Rojo';
        else if (vtaTotalEst === unidades) alerta = 'Naranja';
        else alerta = 'Verde';
      }
      unidRiesgo = Math.ceil(unidades - vtaTotalEst);
    }
    return { idx: idx+1, ean: entry.ean, nombre: product ? product.nombre : 'EAN no encontrado',
      ctg: product ? product.ctg : '', unidades, fecha: entry.fecha,
      diasNetos, diasReales, vtaTotalEst, alerta, unidRiesgo };
  });

  renderResults(results);
  goScreen(3);
}

  const el = document.getElementById('resultsContent');

    '<div class="result-stats">' +
      '<div class="stat-box"><div class="stat-num">' + rojos + '</div><div class="stat-label">🔴 Rojo</div></div>' +

      '<div class="stat-box"><div class="stat-num">' + verdes + '</div><div class="stat-label">🟢 Verde</div></div>' +
      '<div class="stat-box"><div class="stat-num">' + results.length + '</div><div class="stat-label">Total</div></div>' +
    '</div></div>';

  results.forEach(r => {
    const cls = r.alerta === 'Rojo' ? 'alerta-rojo' : r.alerta === 'Naranja' ? 'alerta-naranja' : 'alerta-verde';
    const vCls = r.alerta === 'Rojo' ? 'rojo' : r.alerta === 'Naranja' ? 'naranja' : '';
    html += '<div class="result-item ' + cls + '">' +
      '<div class="result-ean">EAN: ' + r.ean + '</div>' +
      '<div class="result-nombre">' + r.nombre + '</div>' +
      '<div style="margin-bottom:8px"><span class="alerta-pill alerta-' + r.alerta + '">' + r.alerta + '</span>' +
        (r.ctg ? ' <span style="font-size:11px;color:var(--texto-suave)">' + r.ctg + '</span>' : '') +
      '</div>' +
      '<div class="result-grid">' +
        '<div class="result-field"><div class="result-field-label">Unidades</div><div class="result-field-val">' + r.unidades + '</div></div>' +
        '<div class="result-field"><div class="result-field-label">Fecha Venc.</div><div class="result-field-val" style="font-size:13px">' + r.fecha + '</div></div>' +
        '<div class="result-field"><div class="result-field-label">Días disp. netos</div><div class="result-field-val">' + r.diasNetos + '</div></div>' +
        '<div class="result-field"><div class="result-field-label">Días disp. reales</div><div class="result-field-val ' + (r.diasReales < 0 ? 'rojo' : '') + '">' + r.diasReales + '</div></div>' +
        '<div class="result-field"><div class="result-field-label">Vta. total est.</div><div class="result-field-val ' + vCls + '">' + (r.vtaTotalEst !== '' ? r.vtaTotalEst : '–') + '</div></div>' +
        '<div class="result-field"><div class="result-field-label">Unid. en riesgo</div><div class="result-field-val ' + (r.unidRiesgo > 0 ? 'rojo' : '') + '">' + (r.unidRiesgo > 0 ? r.unidRiesgo : '–') + '</div></div>' +
      '</div></div>';
  });

  el.innerHTML = html;
  window._lastResults = results;
}

function getReportData() {
  const results = window._lastResults || [];
  const headers = ['Punto de venta','EAN','Nombre','Categoría','Unidades','Fecha Vencimiento','Días disp. netos','Días disp. reales','Vta. total est.','Alerta','Unid. en riesgo'];
  const rows = results.map(r => ({
    'Punto de venta': selectedStore ? selectedStore.id : '',
    'EAN': r.ean,
    'Nombre': r.nombre,
    'Categoría': r.ctg,
    'Unidades': r.unidades,
    'Fecha Vencimiento': r.fecha,
    'Días disp. netos': r.diasNetos,
    'Días disp. reales': r.diasReales,
    'Vta. total est.': r.vtaTotalEst,
    'Alerta': r.alerta,
    'Unid. en riesgo': r.unidRiesgo > 0 ? r.unidRiesgo : 0
  }));
  return { headers, rows };
}

function exportXLSX() {
  const results = window._lastResults;
  if (!results || results.length === 0) { showToast('⚠️ No hay resultados'); return; }
  const { rows } = getReportData();
  const ws = XLSX.utils.json_to_sheet(rows);

  // Column widths
  ws['!cols'] = [
    {wch:14},{wch:16},{wch:38},{wch:22},{wch:10},{wch:16},
    {wch:16},{wch:16},{wch:14},{wch:10},{wch:14}
  ];

  // Style header row (row 1) - orange bg
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let C = range.s.c; C <= range.e.c; C++) {
    const addr = XLSX.utils.encode_cell({r:0, c:C});
    if (!ws[addr]) continue;
    ws[addr].s = {
      font: { bold: true, color: { rgb: 'FFFFFF' } },
      fill: { fgColor: { rgb: 'E65100' } },
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true }
    };
  }

  // Color alert cells
  for (let R = 1; R <= range.e.r; R++) {
    const alertCell = XLSX.utils.encode_cell({r:R, c:9}); // Alerta col
    if (ws[alertCell]) {
      const alerta = ws[alertCell].v;
      const colors = { 'Rojo': 'FFCDD2', 'Naranja': 'FFE0B2', 'Verde': 'C8E6C9' };
      const fontColors = { 'Rojo': 'B71C1C', 'Naranja': 'E65100', 'Verde': '1B5E20' };
      if (colors[alerta]) {
        ws[alertCell].s = {
          font: { bold: true, color: { rgb: fontColors[alerta] } },
          fill: { fgColor: { rgb: colors[alerta] } },
          alignment: { horizontal: 'center' }
        };
      }
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Próximos a Vencer');

  // Add summary sheet
  const today = new Date().toLocaleDateString('es-CO');
  const rojos = results.filter(r => r.alerta === 'Rojo').length;
  const naranjas = results.filter(r => r.alerta === 'Naranja').length;
  const verdes = results.filter(r => r.alerta === 'Verde').length;
  const summaryData = [
    { 'Campo': 'Punto de venta', 'Valor': selectedStore ? selectedStore.id + ' – ' + selectedStore.direccion : '' },
    { 'Campo': 'Fecha reporte', 'Valor': today },
    { 'Campo': 'Total productos', 'Valor': results.length },
    { 'Campo': '🔴 Alertas Rojo', 'Valor': rojos },
    { 'Campo': '🟠 Alertas Naranja', 'Valor': naranjas },
    { 'Campo': '🟢 Alertas Verde', 'Valor': verdes },
  ];
  const ws2 = XLSX.utils.json_to_sheet(summaryData);
  ws2['!cols'] = [{wch:22},{wch:40}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Resumen');

  const fname = 'Proximos_Vencer_PV' + (selectedStore ? selectedStore.id : '') + '_' + new Date().toISOString().slice(0,10) + '.xlsx';
  XLSX.writeFile(wb, fname, {bookSST: false, type: 'binary', cellStyles: true});
  window._lastFilename = fname;
  showToast('✅ Excel descargado');
}

// ===================== SCANNER =====================
let scannerActive = false;
let codeReader = null;
let scanTargetId = null;
let activeStream = null;

function openScanner(entryId) {
  scanTargetId = entryId;
  document.getElementById('scannerModal').classList.add('open');
  document.getElementById('scanStatus').textContent = 'Iniciando cámara...';
  startScanner();
}

function closeScanner() {
  document.getElementById('scannerModal').classList.remove('open');
  stopScanner();
}

function stopScanner() {
  scannerActive = false;
  if (codeReader) {
    try { codeReader.reset(); } catch(e) {}
    codeReader = null;
  }
  if (activeStream) {
    activeStream.getTracks().forEach(t => t.stop());
    activeStream = null;
  }
  const video = document.getElementById('scannerVideo');
  video.srcObject = null;
}

async function startScanner() {
  stopScanner();
  scannerActive = true;

  try {
    // Try ZXing first
    if (window.ZXing) {
      codeReader = new ZXing.BrowserMultiFormatReader();
      const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();
      // Prefer back camera
      const backCam = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length - 1];
      const deviceId = backCam ? backCam.deviceId : undefined;

      document.getElementById('scanStatus').textContent = 'Apunta al código EAN...';

      codeReader.decodeFromVideoDevice(deviceId, 'scannerVideo', (result, err) => {
        if (!scannerActive) return;
        if (result) {
          const code = result.getText();
          if (/^\d{8,14}$/.test(code)) {
            handleScanResult(code);
          }
        }
      });
    } else {
      // Fallback: native getUserMedia + canvas decode attempt
      document.getElementById('scanStatus').textContent = 'ZXing no cargó. Intenta recargar.';
    }
  } catch(e) {
    document.getElementById('scanStatus').textContent = 'Error cámara: ' + e.message;
    console.error(e);
  }
}

function handleScanResult(code) {
  if (!scannerActive) return;
  // Vibrate feedback
  if (navigator.vibrate) navigator.vibrate(100);
  document.getElementById('scanStatus').textContent = '✅ Detectado: ' + code;
  
  closeScanner();
  
  // Set value in the entry
  const inp = document.getElementById('ean_' + scanTargetId);
  if (inp) {
    inp.value = code;
    onEanChange(scanTargetId, code);
    // Focus units field next
    setTimeout(() => {
      const und = document.getElementById('und_' + scanTargetId);
      if (und) und.focus();
    }, 200);
  }
  showToast('✅ EAN escaneado: ' + code);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
